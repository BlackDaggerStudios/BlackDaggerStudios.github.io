<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0B0C; color: #EDEBE8; font: 18px/1.6 "Inter", system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;

  .code { font: 800 clamp(72px, 16vw, 140px)/1 "Cinzel", serif; letter-spacing: 6px; margin: 0; color: #EDEBE8; }
  .code span { color: #E53950; }
  h1 { font: 800 clamp(22px, 3.5vw, 30px) "Cinzel", serif; letter-spacing: 2px; margin: 18px 0 6px; }
  p { margin: 0 auto; color: #A6A6AB; max-width: 40ch; }
  .stamp { display: inline-block; margin: 26px 0 30px; transform: rotate(-6deg); border: 3px double #E53950; color: #E53950; border-radius: 6px; padding: 4px 12px; font: 700 14px "Inter", sans-serif; letter-spacing: 2px; }

  a.btn:hover { background: #A50D26; }
  a.btn:focus-visible { outline: 2px solid #E53950; outline-offset: 3px; }

<main>
  <p class="code">4<span>0</span>4</p>

</main>
<script>
  if ((navigator.language || "").toLowerCase().startsWith("pl")) {
    document.documentElement.lang = "pl";

    document.getElementById("d").textContent = "Ta strona zaginęła w akcji. Mogła zostać przeniesiona albo nigdy nie istniała.";
    document.getElementById("s").textContent = "Status: zaginiona";
